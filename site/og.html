<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=GFS+Didot&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --vert:#1E3B2C; --vert-deep:#16301F;
    --dorure:#C3A343; --dorure-pale:#D8BE74;
    --maroquin:#7E2D26; --papier:#F2EAD8;
    --didot:"GFS Didot","Didot",serif;
    --garamond:"EB Garamond",Garamond,serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px}
  body{
    background:
      radial-gradient(120% 90% at 50% 0%, #23472F 0%, var(--vert) 45%, var(--vert-deep) 100%);
    font-family:var(--garamond); color:var(--papier);
    position:relative; overflow:hidden;
  }
  /* thin gilt rule frame */
  .frame{position:absolute; inset:34px; border:1.5px solid rgba(195,163,67,.55);}
  .frame::before{content:""; position:absolute; inset:6px; border:.75px solid rgba(195,163,67,.28);}

  .plate{
    position:absolute; left:0; right:0; top:96px;
    text-align:center; padding:0 90px;
  }
  .overline{
    font-family:var(--didot); color:var(--dorure);
    font-size:20px; letter-spacing:.42em; text-transform:uppercase;
    padding-left:.42em;
  }
  .title{
    font-family:var(--didot); font-weight:400;
    font-size:150px; line-height:.98; letter-spacing:.04em;
    color:var(--papier); margin:18px 0 4px;
    text-shadow:0 2px 0 rgba(0,0,0,.25);
  }
  .rule{
    width:280px; height:0; margin:14px auto 20px;
    border-top:1px solid rgba(195,163,67,.7);
    position:relative;
  }
  .rule::after{
    content:"\2766"; position:absolute; top:-16px; left:50%; transform:translateX(-50%);
    color:var(--dorure); font-size:22px; background:transparent; padding:0 10px;
  }
  .sub{
    font-family:var(--garamond); font-size:29px; line-height:1.4;
    color:var(--papier); opacity:.94; max-width:820px; margin:0 auto;
  }
  .cite{
    display:inline-block; margin-top:26px;
    font-family:var(--didot); font-size:24px; letter-spacing:.14em;
    color:var(--dorure-pale);
    border:1px solid rgba(195,163,67,.5); border-radius:3px;
    padding:9px 22px;
  }
  .cite b{color:var(--papier); font-weight:400}

  /* the shelf */
  .shelf{
    position:absolute; left:34px; right:34px; bottom:34px; height:132px;
    display:flex; align-items:flex-end; gap:8px;
    padding:0 40px 0 40px;
  }
  .spine{
    flex:1 1 auto; border-radius:2px 2px 0 0;
    background:linear-gradient(90deg, rgba(255,255,255,.10), rgba(0,0,0,.12) 60%, rgba(0,0,0,.28));
    background-color:#20402C;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);
    position:relative;
    display:flex; align-items:center; justify-content:center;
  }
  .spine .lbl{
    writing-mode:vertical-rl; text-orientation:mixed;
    font-family:var(--didot); font-size:12px; letter-spacing:.18em;
    color:var(--dorure); opacity:.9;
  }
  .spine .band{
    position:absolute; left:6px; right:6px; height:26px;
    background:var(--maroquin); border-radius:1px;
    box-shadow:inset 0 0 0 1px rgba(195,163,67,.5);
    display:flex; align-items:center; justify-content:center;
  }
  .spine .band.top{top:16px}
  .spine .band .n{
    writing-mode:horizontal-tb; font-family:var(--didot);
    font-size:11px; color:var(--dorure-pale); letter-spacing:.05em;
  }
  /* the ghost: PG 162, lost in the 1868 fire */
  .spine.ghost{
    background:transparent; background-color:transparent;
    border:1.5px dashed rgba(216,190,116,.5);
    box-shadow:none;
  }
  .spine.ghost .lbl{color:rgba(216,190,116,.6); opacity:.7}
  .shelf-floor{
    position:absolute; left:34px; right:34px; bottom:30px; height:4px;
    background:linear-gradient(90deg, transparent, rgba(195,163,67,.55), transparent);
  }
</style>
</head>
<body>
  <div class="frame"></div>

  <div class="plate">
    <div class="overline">Patrologiæ Cursus Completus</div>
    <div class="title">MIGNE</div>
    <div class="rule"></div>
    <div class="sub">Every column of the Patrologia Latina &amp; Graeca — readable, citable, and work by work rendered into English for the first time.</div>
    <div class="cite">migne.app / <b>pl</b> / 139 / 473a</div>
  </div>

  <div class="shelf" id="shelf"></div>
  <div class="shelf-floor"></div>

  <script>
    // build a shelf of spines; a few carry gilt labels, one is the PG 162 ghost
    const shelf = document.getElementById('shelf');
    const N = 34;
    const labelled = new Set([3,7,11,16,21,27]);
    const heights = [];
    for(let i=0;i<N;i++){
      const s = document.createElement('div');
      s.className='spine';
      // vary heights a touch, biblio-shelf irregularity
      const h = 100 + ((i*37)%5)*6;
      s.style.height = h+'px';
      if(i===23){ s.className='spine ghost'; s.style.height='108px';
        const l=document.createElement('div'); l.className='lbl'; l.textContent='PG 162'; s.appendChild(l);
      } else if(labelled.has(i)){
        const b=document.createElement('div'); b.className='band top';
        const n=document.createElement('div'); n.className='n'; n.textContent=(i<12?'PL':'PG');
        b.appendChild(n); s.appendChild(b);
      }
      shelf.appendChild(s);
    }
  </script>
</body>
</html>
